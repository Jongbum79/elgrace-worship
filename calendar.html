<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Elgrace Calendar & PBS</title>
  
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --forest: #123C2B;
      --forest-light: #1C543E;
      --emerald: #059669;
      --emerald-bg: #ECFDF5;
      --emerald-border: #A7F3D0;
      --blue: #2563EB;
      --blue-bg: #EFF6FF;
      --blue-border: #BFDBFE;
      --card-border: rgba(0, 0, 0, 0.08);
      --card-hover: rgba(0, 0, 0, 0.03);
      --ink: #2F3437;
      --muted: #787774;
      --muted-light: #9B9A97;
      --bg-color: transparent;
      --cal-header-bg: rgba(247, 246, 243, 0.85);
      --cell-bg: #FFFFFF;
      --today-bg: #FEF3C7;
      --today-border: #F59E0B;
      --sunday-color: #DC2626;
      --saturday-color: #2563EB;
      --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"], @media (prefers-color-scheme: dark) {
      :root {
        --forest: #438368;
        --forest-light: #529E7E;
        --emerald: #34D399;
        --emerald-bg: rgba(16, 185, 129, 0.15);
        --emerald-border: rgba(16, 185, 129, 0.35);
        --blue: #60A5FA;
        --blue-bg: rgba(37, 99, 235, 0.15);
        --blue-border: rgba(37, 99, 235, 0.35);
        --card-border: rgba(255, 255, 255, 0.1);
        --card-hover: rgba(255, 255, 255, 0.05);
        --ink: #E6E5E3;
        --muted: #9B9A97;
        --muted-light: #6A6966;
        --cal-header-bg: rgba(37, 37, 37, 0.85);
        --cell-bg: #202020;
        --today-bg: rgba(245, 158, 11, 0.2);
        --today-border: #FBBF24;
        --sunday-color: #F87171;
        --saturday-color: #60A5FA;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: var(--bg-color);
      color: var(--ink);
      font-family: var(--font-sans);
      width: 100%;
      overflow-x: hidden;
    }

    .calendar-app {
      width: 100%;
      max-width: 100%;
      padding: 4px 2px 16px 2px;
    }

    /* Top Month Header */
    .cal-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 4px 6px;
    }

    .cal-month-nav {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-arrow-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: var(--cal-header-bg);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-arrow-btn:hover {
      border-color: var(--forest);
      color: var(--forest);
      background: var(--card-hover);
    }

    .current-month-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .cal-legend-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .legend-dot.pbs { background: var(--emerald); }
    .legend-dot.church { background: var(--blue); }

    /* Calendar Grid Table */
    .calendar-grid {
      width: 100%;
      border-collapse: separate;
      border-spacing: 4px;
      table-layout: fixed;
    }

    .cal-weekday-header th {
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
    }

    .cal-weekday-header th.sunday { color: var(--sunday-color); }
    .cal-weekday-header th.saturday { color: var(--saturday-color); }

    .cal-day-cell {
      height: 98px;
      vertical-align: top;
      background: var(--cell-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 4px;
      transition: all 0.15s ease;
      position: relative;
    }

    .cal-day-cell:hover {
      border-color: rgba(0, 0, 0, 0.2);
    }

    .cal-day-cell.other-month {
      opacity: 0.35;
      background: transparent;
    }

    .cal-day-cell.today {
      background: var(--today-bg);
      border-color: var(--today-border);
      box-shadow: 0 0 0 1px var(--today-border);
    }

    .cell-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      padding: 0 2px;
    }

    .day-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }

    .cal-day-cell.sunday .day-num { color: var(--sunday-color); }
    .cal-day-cell.saturday .day-num { color: var(--saturday-color); }

    .today-badge {
      font-size: 10px;
      font-weight: 800;
      background: var(--today-border);
      color: #FFFFFF;
      padding: 1px 5px;
      border-radius: 4px;
      line-height: 1.2;
    }

    .cell-events-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* Event Badges */
    .event-chip {
      display: block;
      padding: 3px 5px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.25;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    /* PBS Event Chip */
    .event-chip.pbs {
      background: var(--emerald-bg);
      color: var(--emerald);
      border: 1px solid var(--emerald-border);
    }

    .event-chip.pbs:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.25);
      border-color: var(--emerald);
    }

    /* Church Event Chip */
    .event-chip.church {
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue-border);
    }

    .event-chip.church:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
    }

    /* Multi-day Event Indicator */
    .event-chip.multiday {
      background: var(--blue);
      color: #FFFFFF;
      border-color: var(--blue);
    }

    /* Bottom Info Bar */
    .cal-bottom-bar {
      margin-top: 14px;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--cal-header-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }

    .cal-bottom-bar a {
      color: var(--emerald);
      font-weight: 700;
      text-decoration: none;
    }

    .cal-bottom-bar a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .cal-day-cell {
        height: 84px;
        padding: 4px 2px;
      }
      .event-chip {
        font-size: 10px;
        padding: 2px 3px;
      }
      .current-month-title {
        font-size: 16px;
      }
      .cal-legend-row {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="calendar-app">
    <!-- Top Month Header -->
    <div class="cal-top-bar">
      <div class="cal-month-nav">
        <button class="nav-arrow-btn" onclick="changeMonth(-1)" title="이전 달">
          <i data-lucide="chevron-left" style="width: 16px; height: 16px;"></i>
        </button>
        <span class="current-month-title" id="monthDisplay">2026년 10월</span>
        <button class="nav-arrow-btn" onclick="changeMonth(1)" title="다음 달">
          <i data-lucide="chevron-right" style="width: 16px; height: 16px;"></i>
        </button>
        <button class="nav-arrow-btn" onclick="goToToday()" title="이번 달로 이동" style="width: auto; padding: 0 8px; font-size: 11.5px; font-weight: 700;">
          오늘
        </button>
      </div>

      <div class="cal-legend-row">
        <span class="legend-item">
          <span class="legend-dot pbs"></span>
          <span>PBS 성경공부 (클릭 시 페이지 이동)</span>
        </span>
        <span class="legend-item">
          <span class="legend-dot church"></span>
          <span>교회 일정 (구글 캘린더)</span>
        </span>
      </div>
    </div>

    <!-- Calendar Grid -->
    <table class="calendar-grid">
      <thead>
        <tr class="cal-weekday-header">
          <th class="sunday">일 (SUN)</th>
          <th>월 (MON)</th>
          <th>화 (TUE)</th>
          <th>수 (WED)</th>
          <th>목 (THU)</th>
          <th>금 (FRI)</th>
          <th class="saturday">토 (SAT)</th>
        </tr>
      </thead>
      <tbody id="calendarGridBody">
        <!-- Rendered by JavaScript -->
      </tbody>
    </table>

    <!-- Bottom Info Bar -->
    <div class="cal-bottom-bar">
      <span>💡 <strong>PBS 일정</strong>을 클릭하시면 해당 주차의 노션 묵상 페이지로 즉시 이동합니다.</span>
      <a href="https://app.notion.com/p/PBS-132b2d68806c805f91e8e6f7bc25d815" target="_blank" rel="noopener">PBS 허브 열기 ↗</a>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Events Database (PBS + Google Calendar 교회 일정)
    const calendarEvents = [
      // 1. 주별 PBS 일정 (매주 주일)
      {
        type: 'pbs',
        date: '2026-09-20',
        title: '📖 창세기 38장',
        url: 'https://app.notion.com/p/PBS-132b2d68806c805f91e8e6f7bc25d815',
        status: '✅ 나눔완료'
      },
      {
        type: 'pbs',
        date: '2026-09-27',
        title: '📖 창세기 39장',
        url: 'https://app.notion.com/p/PBS-132b2d68806c805f91e8e6f7bc25d815',
        status: '✅ 나눔완료'
      },
      {
        type: 'pbs',
        date: '2026-10-04',
        title: '📖 출애굽기 19장',
        url: 'https://app.notion.com/p/2026-10-04-19-3e8b2d68806c816188bcf3b8cfecdcff',
        status: '⏳ 묵상준비완료'
      },
      {
        type: 'pbs',
        date: '2026-10-11',
        title: '📖 출애굽기 20장',
        url: 'https://app.notion.com/p/PBS-132b2d68806c805f91e8e6f7bc25d815',
        status: '예정'
      },
      {
        type: 'pbs',
        date: '2026-10-18',
        title: '📖 출애굽기 21장',
        url: 'https://app.notion.com/p/PBS-132b2d68806c805f91e8e6f7bc25d815',
        status: '예정'
      },
      {
        type: 'pbs',
        date: '2026-10-25',
        title: '📖 출애굽기 22장',
        url: 'https://app.notion.com/p/PBS-132b2d68806c805f91e8e6f7bc25d815',
        status: '예정'
      },
      {
        type: 'pbs',
        date: '2026-11-01',
        title: '📖 출애굽기 23장',
        url: 'https://app.notion.com/p/PBS-132b2d68806c805f91e8e6f7bc25d815',
        status: '예정'
      },

      // 2. 구글 캘린더 '교회 일정'
      {
        type: 'church',
        date: '2026-09-28',
        title: '⛪ 21:00 기도회',
        time: '21:00 ~ 22:00',
        desc: '주은혜교회 기도회'
      },
      {
        type: 'church',
        date: '2026-10-02',
        title: '⛪ 20:00 직분자 기도회',
        time: '20:00 ~ 21:00',
        desc: '주은혜교회 직분자 기도회'
      },
      {
        type: 'church',
        date: '2026-10-24',
        title: '⛪ 20:00 산상기도회',
        time: '20:00 ~ 21:00',
        desc: '주은혜교회 산상기도회'
      },
      {
        type: 'church',
        date: '2026-10-26',
        endDate: '2026-10-28',
        title: '⛪ 말씀과 삶 사경회 (1일차)',
        time: '20:00 ~ 21:00',
        desc: '제4회 말씀과 삶 사경회'
      },
      {
        type: 'church',
        date: '2026-10-27',
        title: '⛪ 말씀과 삶 사경회 (2일차)',
        time: '20:00 ~ 21:00',
        desc: '제4회 말씀과 삶 사경회'
      },
      {
        type: 'church',
        date: '2026-10-28',
        title: '⛪ 말씀과 삶 사경회 (3일차)',
        time: '20:00 ~ 21:00',
        desc: '제4회 말씀과 삶 사경회'
      }
    ];

    // Calendar State
    let currentYear = 2026;
    let currentMonth = 9; // 0-indexed: 9 = 10월

    function changeMonth(delta) {
      currentMonth += delta;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      } else if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar();
    }

    function goToToday() {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      renderCalendar();
    }

    function renderCalendar() {
      const monthTitle = document.getElementById('monthDisplay');
      monthTitle.textContent = `${currentYear}년 ${currentMonth + 1}월`;

      const gridBody = document.getElementById('calendarGridBody');
      gridBody.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth, 1).getDay(); // 0(Sun) - 6(Sat)
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      let currentDay = 1;
      let nextMonthDay = 1;

      // 6 Weeks Grid
      for (let week = 0; week < 6; week++) {
        const row = document.createElement('tr');
        let hasCurrentMonthDays = false;

        for (let col = 0; col < 7; col++) {
          const cell = document.createElement('td');
          cell.className = 'cal-day-cell';

          let cellDateStr = '';
          let cellDayNum = 0;

          if (col === 0) cell.classList.add('sunday');
          if (col === 6) cell.classList.add('saturday');

          if (week === 0 && col < firstDay) {
            // Previous Month Days
            cell.classList.add('other-month');
            cellDayNum = prevMonthDays - firstDay + col + 1;
            const pMonth = currentMonth === 0 ? 12 : currentMonth;
            const pYear = currentMonth === 0 ? currentYear - 1 : currentYear;
            cellDateStr = `${pYear}-${String(pMonth).padStart(2, '0')}-${String(cellDayNum).padStart(2, '0')}`;
          } else if (currentDay <= daysInMonth) {
            // Current Month Days
            hasCurrentMonthDays = true;
            cellDayNum = currentDay;
            cellDateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(cellDayNum).padStart(2, '0')}`;
            if (cellDateStr === todayStr) {
              cell.classList.add('today');
            }
            currentDay++;
          } else {
            // Next Month Days
            cell.classList.add('other-month');
            cellDayNum = nextMonthDay;
            const nMonth = currentMonth === 11 ? 1 : currentMonth + 2;
            const nYear = currentMonth === 11 ? currentYear + 1 : currentYear;
            cellDateStr = `${nYear}-${String(nMonth).padStart(2, '0')}-${String(cellDayNum).padStart(2, '0')}`;
            nextMonthDay++;
          }

          // Top Header (Day number + Today badge)
          const topRow = document.createElement('div');
          topRow.className = 'cell-top-row';
          topRow.innerHTML = `<span class="day-num">${cellDayNum}</span>`;
          if (cellDateStr === todayStr) {
            topRow.innerHTML += `<span class="today-badge">오늘</span>`;
          }
          cell.appendChild(topRow);

          // Events Container
          const evContainer = document.createElement('div');
          evContainer.className = 'cell-events-list';

          // Match Events
          const dayEvents = calendarEvents.filter(e => e.date === cellDateStr);
          dayEvents.forEach(ev => {
            const chip = document.createElement('a');
            chip.className = `event-chip ${ev.type}`;
            chip.textContent = ev.title;

            if (ev.type === 'pbs') {
              chip.href = ev.url;
              chip.target = '_blank';
              chip.rel = 'noopener';
              chip.title = `클릭 시 ${ev.title} 노션 PBS 페이지로 이동합니다.`;
            } else {
              chip.title = `${ev.title} (${ev.time || '종일'})\n${ev.desc || ''}`;
              chip.onclick = () => {
                alert(`⛪ ${ev.title}\n일시: ${cellDateStr} ${ev.time || ''}\n내용: ${ev.desc || ''}`);
              };
            }
            evContainer.appendChild(chip);
          });

          cell.appendChild(evContainer);
          row.appendChild(cell);
        }

        if (week > 0 && !hasCurrentMonthDays) {
          break; // Stop rendering extra empty weeks
        }
        gridBody.appendChild(row);
      }
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      renderCalendar();
    });
  </script>
</body>
</html>
